name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/jmi-ci-tests.db
      LOG_LEVEL: INFO
      SERVICE_NAME: jmi-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.lock

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock

      - name: Run backend lint
        run: python -m ruff check alembic backend scripts tests/

      - name: Run backend tests
        run: python -m pytest

  migrations:
    name: Alembic Migrations
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      DATABASE_URL: sqlite:////tmp/jmi-ci-migrations.db
      LOG_LEVEL: INFO
      SERVICE_NAME: jmi-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.lock

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock

      - name: Validate Alembic upgrade on fresh SQLite
        run: |
          rm -f /tmp/jmi-ci-migrations.db
          python -m alembic upgrade head

      - name: Run migration tests
        run: python -m pytest tests/test_migrations.py

      - name: Run idempotent seed smoke
        run: |
          python -m scripts.seed_demo --quiet
          python -m scripts.seed_demo --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
